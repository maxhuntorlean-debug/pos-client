<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4ea6ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Котопанда">
  <title>Котопанда POS</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="https://pos-admin.lateshoy.workers.dev/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="https://pos-admin.lateshoy.workers.dev/assets/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(error => {
          console.error("Service Worker:", error);
        });
      });
    }
  </script>
</body>
</html>
